<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>城市图志</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="../resources/vendor/echarts.min.js" defer></script>
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main class="workspace">
      <aside class="library" aria-label="地图选择">
        <div class="library-head">
          <label class="search-label" for="search">搜索地图</label>
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 4 4" /></svg
            ><input
              id="search"
              type="search"
              title="搜索地图（Ctrl+K）"
              placeholder="省市区县名称 / 拼音"
              autocomplete="off"
            />
          </div>
          <label class="search-label" for="level">地图层级</label>
          <select id="level">
            <option value="">全部层级</option>
            <option value="country">全国地图</option>
            <option value="province">省级地图</option>
            <option value="city">城市地图</option>
            <option value="county">区县地图</option>
          </select>
          <label class="search-label region-label" for="province">按地区浏览</label
          ><select id="province">
            <option value="">全部地区</option>
          </select>
        </div>
        <div class="list-caption">
          <span id="results-count">正在加载…</span>
        </div>
        <div id="city-list" class="city-list" aria-label="地图列表"></div>
      </aside>
      <section class="studio" aria-label="地图预览">
        <div class="studio-toolbar">
          <nav id="breadcrumb" aria-label="地图层级">地图工作台</nav>
          <div class="view-actions">
            <button id="zoom-out" class="icon-button" aria-label="缩小地图" title="缩小">−</button
            ><button id="reset-view" class="text-button">适应画布</button
            ><button id="zoom-in" class="icon-button" aria-label="放大地图" title="放大">＋</button>
          </div>
        </div>
        <div class="canvas-area">
          <div class="paper" id="paper">
            <div id="map" role="img" aria-label="地图正在加载"></div>
            <div id="map-message" class="map-message" role="status">正在打开地图…</div>
          </div>
        </div>
      </section>
      <aside class="inspector" aria-label="制图设置">
        <div class="inspector-scroll">
          <section class="setting-section">
            <h3>地图内容</h3>
            <fieldset class="segmented">
              <legend class="sr-only">地图类型</legend>
              <label
                ><input type="radio" name="variant" value="districts" checked /><span
                  >行政区边界</span
                ></label
              ><label
                ><input type="radio" name="variant" value="outline" /><span>纯轮廓</span></label
              >
            </fieldset>
            <label class="toggle-row" for="labels"
              ><span>显示分区名称</span><input id="labels" type="checkbox" checked
            /></label>
            <label class="toggle-row" for="show-title"
              ><span>显示地图标题</span><input id="show-title" type="checkbox" checked
            /></label>
            <label class="field-label" for="map-title">标题文字</label
            ><input id="map-title" type="text" maxlength="40" placeholder="随地图自动更新" />
          </section>
          <section class="setting-section">
            <div class="section-heading">
              <h3>色彩与线条</h3>
              <button id="reset-style" class="text-button">重置</button>
            </div>
            <div class="palettes" aria-label="配色方案">
              <button class="palette active" data-palette="atlas" aria-pressed="true">
                <i class="swatch atlas"></i>青山</button
              ><button class="palette" data-palette="clay" aria-pressed="false">
                <i class="swatch clay"></i>陶土</button
              ><button class="palette" data-palette="ink" aria-pressed="false">
                <i class="swatch ink"></i>墨蓝
              </button>
            </div>
            <label class="color-row" for="fill-color"
              ><span>地图填充</span
              ><span class="color-control"
                ><output id="fill-value">#B8CDBE</output
                ><input id="fill-color" type="color" value="#b8cdbe" /></span
            ></label>
            <label class="color-row" for="border-color"
              ><span>边界线条</span
              ><span class="color-control"
                ><output id="border-value">#526D60</output
                ><input id="border-color" type="color" value="#526d60" /></span
            ></label>
            <label class="color-row" for="text-color"
              ><span>文字颜色</span
              ><span class="color-control"
                ><output id="text-value">#526D60</output
                ><input id="text-color" type="color" value="#526d60" /></span
            ></label>
            <label class="color-row" for="background-color"
              ><span>画布背景</span
              ><span class="color-control"
                ><output id="background-value">#FAF9F5</output
                ><input id="background-color" type="color" value="#faf9f5" /></span
            ></label>
            <label class="range-label" for="line-width"
              ><span>线条粗细</span><output id="line-width-value">1 px</output></label
            ><input id="line-width" type="range" min="0.3" max="3" step="0.1" value="1" />
          </section>
          <section class="setting-section export-section">
            <h3>导出</h3>
            <label class="field-label" for="export-scale">图片精度</label
            ><select id="export-scale">
              <option value="1">1 倍</option>
              <option value="2" selected>2 倍</option>
              <option value="3">3 倍</option>
              <option value="4">4 倍</option>
            </select>
            <p id="export-size" class="export-size"></p>
            <label class="toggle-row" for="transparent"
              ><span>透明背景</span><input id="transparent" type="checkbox"
            /></label>
          </section>
          <details class="data-note">
            <summary>关于地图数据</summary>
            <p id="current-source"></p>
            <p>2026 年 10 月下载，来源标注局部更新。仅供地图可视化，使用条款见随包说明。</p>
          </details>
        </div>
        <div class="export-action">
          <button id="export" class="primary-button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></svg
            >导出 PNG
          </button>
        </div>
      </aside>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
